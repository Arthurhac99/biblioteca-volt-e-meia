# =============================================================
#  Configuração do site (Zensical)
#  Tudo que começa com # é comentário e não afeta nada.
# =============================================================

[project]
site_name = "Biblioteca Volt e Meia"
site_description = "Resumos e curadoria de vídeos de Engenharia Mecatrônica, organizados por matéria."
site_author = "Arthur Henrique"
copyright = "Conteúdo por Arthur Henrique · Volt e Meia"

# Endereço do site e do repositório
site_url = "https://arthurhac99.github.io/biblioteca-volt-e-meia/"
repo_url = "https://github.com/Arthurhac99/biblioteca-volt-e-meia"

extra_css = ["stylesheets/extra.css"]
extra_javascript = [
  "javascripts/mathjax.js",
  "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]

# Menu lateral. Para adicionar uma página nova, crie o arquivo .md
# dentro de docs/ e acrescente uma linha aqui, no lugar certo.
nav = [
  { "Início" = "index.md" },
  { "Matérias" = [
      "materias/index.md",
      { "Controle" = [
          "materias/controle/index.md",
          { "Sistemas de 1ª ordem" = "materias/controle/primeira-ordem.md" },
      ] },
      { "Automação Industrial" = "materias/automacao-industrial/index.md" },
      { "Programação e POO" = "materias/programacao/index.md" },
      { "Máquinas Elétricas" = "materias/maquinas-eletricas/index.md" },
      { "Eletrônica" = "materias/eletronica/index.md" },
      { "Mecânica" = "materias/mecanica/index.md" },
  ] },
  { "Vídeos e canais" = "videos/index.md" },
  { "Sobre" = "sobre.md" },
  { "Como contribuir" = "contribuir.md" },
]

[project.theme]
language = "pt-BR"
features = [
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

# Cores da marca: preto com destaque vermelho, nos modos claro e escuro.
[[project.theme.palette]]
scheme = "default"
primary = "black"
accent = "red"
toggle.icon = "lucide/sun"
toggle.name = "Mudar para modo escuro"

[[project.theme.palette]]
scheme = "slate"
primary = "black"
accent = "red"
toggle.icon = "lucide/moon"
toggle.name = "Mudar para modo claro"

# Recursos extras do Markdown (caixas de aviso, fórmulas, abas, tabelas etc.)
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
