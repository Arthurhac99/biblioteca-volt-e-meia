# =============================================================
#  Configuração do site (Zensical)
#  Tudo que começa com # é comentário e não afeta nada.
# =============================================================

[project]
site_name = "Biblioteca Volt e Meia"
site_description = "Resumos e curadoria de vídeos de Engenharia Mecatrônica, organizados por matéria."
site_author = "Arthur Henrique"
copyright = "Conteúdo por Arthur Henrique · Volt e Meia"

# Endereço do site e do repositório
site_url = "https://arthurhac99.github.io/biblioteca-volt-e-meia/"
repo_url = "https://github.com/Arthurhac99/biblioteca-volt-e-meia"

extra_css = ["stylesheets/extra.css"]
extra_javascript = [
  "javascripts/mathjax.js",
  "javascripts/videos.js",
  "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]

# Menu lateral. Para adicionar uma página nova, crie o arquivo .md
# dentro de docs/ e acrescente uma linha aqui, no lugar certo.
nav = [
  { "Início" = "index.md" },
  { "Matérias" = [
      "materias/index.md",
      { "Elétrica" = [
          "materias/eletrica/index.md",
          { "Circuitos Elétricos 1 e 2" = "materias/eletrica/circuitos-eletricos/index.md" },
          { "Eletrônica de Potência" = "materias/eletrica/eletronica-de-potencia/index.md" },
          { "Máquinas e Acionamentos Elétricos" = "materias/eletrica/maquinas-e-acionamentos/index.md" },
          { "Laboratório de Máquinas e Acionamentos" = "materias/eletrica/laboratorio-de-maquinas/index.md" },
          { "Qualidade de Energia Elétrica" = "materias/eletrica/qualidade-de-energia/index.md" },
      ] },
      { "Eletrônica" = [
          "materias/eletronica/index.md",
          { "Eletrônica 1 e 2" = "materias/eletronica/eletronica-1-e-2/index.md" },
          { "Sistemas Digitais" = "materias/eletronica/sistemas-digitais/index.md" },
          { "Microprocessadores" = "materias/eletronica/microprocessadores/index.md" },
          { "Sistemas Embarcados" = "materias/eletronica/sistemas-embarcados/index.md" },
      ] },
      { "Automação" = [
          "materias/automacao/index.md",
          { "Informática Industrial" = "materias/automacao/informatica-industrial/index.md" },
          { "Automação Industrial" = "materias/automacao/automacao-industrial/index.md" },
          { "Instrumentação e Sistemas de Medidas" = "materias/automacao/instrumentacao/index.md" },
          { "Integração de Sistemas Automatizados" = "materias/automacao/integracao-de-sistemas/index.md" },
      ] },
      { "Controle" = [
          "materias/controle/index.md",
          { "Modelagem de Sistemas Dinâmicos 1 e 2" = "materias/controle/modelagem/index.md" },
          { "Controle de Sistemas Dinâmicos" = [
              "materias/controle/controle-de-sistemas-dinamicos/index.md",
              { "Sistemas de 1ª ordem" = "materias/controle/controle-de-sistemas-dinamicos/primeira-ordem.md" },
          ] },
          { "Controle Digital de Sistemas Dinâmicos" = "materias/controle/controle-digital/index.md" },
          { "Controle Multivariável" = "materias/controle/controle-multivariavel/index.md" },
          { "Introdução à Robótica" = "materias/controle/introducao-a-robotica/index.md" },
      ] },
      { "Mecânica" = [
          "materias/mecanica/index.md",
          { "Materiais para Engenharia" = "materias/mecanica/materiais/index.md" },
          { "Processos de Fabricação" = "materias/mecanica/processos-de-fabricacao/index.md" },
          { "Estática Aplicada às Máquinas" = "materias/mecanica/estatica/index.md" },
          { "Dinâmica Aplicada às Máquinas" = "materias/mecanica/dinamica/index.md" },
          { "Mecânica dos Sólidos" = "materias/mecanica/mecanica-dos-solidos/index.md" },
          { "Mecanismos e Elementos de Máquinas" = "materias/mecanica/mecanismos-e-elementos/index.md" },
          { "Mecânica Computacional" = "materias/mecanica/mecanica-computacional/index.md" },
          { "Vibrações Mecânicas" = "materias/mecanica/vibracoes/index.md" },
          { "Motores de Combustão Interna" = "materias/mecanica/motores-de-combustao/index.md" },
      ] },
      { "Computação" = [
          "materias/computacao/index.md",
          { "Algoritmos e Estruturas de Dados 1 e 2" = "materias/computacao/aeds/index.md" },
          { "Programação Orientada a Objetos" = "materias/computacao/poo/index.md" },
          { "Cálculo Numérico" = "materias/computacao/calculo-numerico/index.md" },
          { "Projeto e Computação Gráfica 1 e 2" = "materias/computacao/pcg/index.md" },
      ] },
      { "Ciclo Básico" = [
          "materias/ciclo-basico/index.md",
          { "Cálculo Diferencial e Integral 1, 2 e 3" = "materias/ciclo-basico/calculo/index.md" },
          { "Geometria Analítica" = "materias/ciclo-basico/geometria-analitica/index.md" },
          { "Álgebra Linear" = "materias/ciclo-basico/algebra-linear/index.md" },
          { "Equações Diferenciais" = "materias/ciclo-basico/equacoes-diferenciais/index.md" },
      ] },
  ] },
  { "Vídeos e canais" = "videos/index.md" },
  { "Sobre" = "sobre.md" },
  { "Como contribuir" = "contribuir.md" },
]

[project.theme]
language = "pt-BR"
logo = "assets/logo.svg"        # o "V" das pontas de prova, no topo do site
favicon = "assets/favicon.svg"  # ícone redondo na aba do navegador
features = [
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

# Cores da marca: preto com destaque vermelho, nos modos claro e escuro.
[[project.theme.palette]]
scheme = "default"
primary = "black"
accent = "red"
toggle.icon = "lucide/sun"
toggle.name = "Mudar para modo escuro"

[[project.theme.palette]]
scheme = "slate"
primary = "black"
accent = "red"
toggle.icon = "lucide/moon"
toggle.name = "Mudar para modo claro"

# Recursos extras do Markdown (caixas de aviso, fórmulas, abas, tabelas etc.)
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
